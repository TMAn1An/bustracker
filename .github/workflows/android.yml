# Builds the Android app (android/) on every change to it: a test APK and, when the signing secrets
# are set, a signed .aab for Google Play. Download them from the run's "Artifacts".
name: Android app
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runners already have the Android SDK (ANDROID_HOME); Gradle downloads platform 36 if needed.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "ANDROID_STOREFILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; fi
      - name: Build
        env:
          ANDROID_STOREPASSWORD: ${{ secrets.ANDROID_STOREPASSWORD }}
          ANDROID_KEYALIAS: ${{ secrets.ANDROID_KEYALIAS }}
          ANDROID_KEYPASSWORD: ${{ secrets.ANDROID_KEYPASSWORD }}
        run: ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: iubat-bus-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: iubat-bus-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
