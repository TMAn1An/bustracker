# Cloudflare Workers (free plan): static app + /api/* in one Worker.
name = "bustracker"   # must match the Worker name in the Cloudflare dashboard (Workers Builds)
main = "worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PRODUCTION = "1"
# Secrets (set with `wrangler secret put`): TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, SESSION_SECRET
# Optional bot check on new usernames: TURNSTILE_SITEKEY (var) + TURNSTILE_SECRET (secret)

# Every minute: push notifications (departure reminders 20 min before, weekly champion / treat report, outbox).
# 1,440 runs a day: at most ~1.5% of the free plan's 100,000 requests/day; each run stays under the 50 sub-request limit.
[triggers]
crons = ["* * * * *"]

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Workers cannot use the Node/SQLite build of the database client: use the HTTP ("web") build.
[alias]
"@libsql/client" = "@libsql/client/web"
